# =========================================================
#  METEORA BOT — strategy defaults (committed to git)
#
#  Tune the bot here, or live from Telegram: /settings → 🧩 Strategy.
#  Telegram edits are saved as overrides in settings.json and win
#  over this file. Values here win over .env when a key is in both.
#
#  Secrets and per-machine settings (wallet, RPC, API keys, Telegram,
#  DRY_RUN) live in .env, which is not committed.
#
#  Exits are per trade (TP / SL / Trail from /positions and the
#  Auto Exit defaults in /settings) — they are not configured here.
# =========================================================

# ===== General =====
# How PnL is shown and computed for every position.

# false = PnL in USD. true = PnL in SOL.
SOL_MODE=false

# ===== Auto Entry · Pools & sizing =====
# Used only while Auto Entry is ON in /settings. The bot watches the pools
# listed in the pool file and opens a two-sided BidAsk position (bins -34/+34)
# when the entry signal fires.

# Pool list file. One pool address per line, or `address,size_sol,max_positions`
# to override the defaults below for that pool.
POOL_LIST_FILE=pool.txt
# Entry size (SOL) for pool lines that only have an address. Must be > 0.
ENTRY_DEFAULT_SIZE_SOL=1
# Max bot entries per pool for pool lines that only have an address.
ENTRY_DEFAULT_MAX_POSITION=1
# Max bot-opened bidask:double positions open at the same time in one pool.
# Other positions in that pool (e.g. ones you opened from /open) do not count.
ENTRY_MAX_CONCURRENT_BIDASK_DOUBLE=1
# Share of the entry size kept as SOL; the rest is swapped to the token.
# 0.5 = half SOL, half token.
ENTRY_SIZE_SPLIT=0.5
# A pool with no entry for this many hours is switched off ('#' added in the pool file).
ENTRY_EXPIRY_HOURS=24
# SOL always kept in the wallet for gas.
GAS_RESERVE=0.05

# ===== Auto Entry · Signal =====
# Entry fires when the GMGN 15m Supertrend is bullish and the live Jupiter
# price touches the Supertrend line.

# Supertrend ATR period.
ST_ATR_PERIOD=10
# Supertrend ATR multiplier.
ST_MULTIPLIER=3
# Entry fires when the price is at or below the line plus this %. 0 = at or below the line.
ENTRY_TOUCH_TOLERANCE_PCT=0
# How often (seconds) the pool list and open positions are refreshed.
ENTRY_SCAN_INTERVAL_SEC=15
# How often (seconds) Jupiter prices are polled for the signal. One batched
# request for all pools; keep it at 2 or more to stay under the rate limit.
JUPITER_POLL_INTERVAL_SEC=2
# Cache of Supertrend lines, so a restart does not have to warm up again.
SUPERTREND_CACHE_FILE=supertrend-cache.json

# ===== Auto Entry · Safety =====
# Checks that stop a bad entry, and what happens after failed entries.

# Price check: skip the entry when the pool price is too far from the Jupiter
# market price (e.g. a thin, mispriced pool). If the market price cannot be
# fetched, the entry goes ahead.
ENTRY_POOL_PRICE_CHECK=true
# Max allowed gap (%) between the pool price and the market price.
ENTRY_MAX_POOL_PRICE_DEVIATION_PCT=15
# How many times to read the price again while the gap is too big.
# Still too big after the last try → the pool is switched off.
ENTRY_POOL_PRICE_MAX_ATTEMPTS=3
# Wait (seconds) between those price re-checks.
ENTRY_POOL_PRICE_RETRY_DELAY_SEC=10
# Wait (seconds) before retrying a pool after a failed entry.
ENTRY_FAILURE_COOLDOWN_SEC=300
# Switch a pool off (and alert on Telegram) after this many failed entries in a row.
ENTRY_MAX_FAILURES=3

# ===== Exit strategy · Evil Panda =====
# Per-trade exit next to TP / SL / Trail. While price is above the 15m
# Supertrend the trade is kept. Once a closed bar breaks below it, the trade
# closes on the next spike (any signal switched on below). If price gets back
# above the Supertrend first, the trade is kept. The break is always judged on
# closed 15m bars; the spike is live or on bar close (EVIL_PANDA_SIGNAL_MODE).
# Turn it on or off per trade with the 🐼 button in /positions.

# New trades start with Evil Panda on (only while Auto Exit is ON in /settings).
EVIL_PANDA_DEFAULT_ON=false
# live  = once armed, check the spike on the live price every check (sells into
#         the wick; can fire on a spike that would fade by the bar close).
# close = only on closed 15m bars (confirmed, but the spike may have faded).
EVIL_PANDA_SIGNAL_MODE=live
# Supertrend ATR period for the exit (separate from the entry Supertrend).
EVIL_PANDA_ST_ATR_PERIOD=10
# Supertrend ATR multiplier for the exit.
EVIL_PANDA_ST_MULTIPLIER=3
# Signal: close when RSI goes above the level.
EVIL_PANDA_RSI=true
# RSI length. 2 = the fastest RSI, made for catching spikes.
EVIL_PANDA_RSI_LENGTH=2
# RSI level (0-100) a bar must close above.
EVIL_PANDA_RSI_LEVEL=90
# Signal: close on the first green MACD histogram bar (crosses from <= 0 to > 0).
EVIL_PANDA_MACD=false
# MACD fast EMA length.
EVIL_PANDA_MACD_FAST=12
# MACD slow EMA length. Must be bigger than the fast length.
EVIL_PANDA_MACD_SLOW=26
# MACD signal EMA length.
EVIL_PANDA_MACD_SIGNAL=9
# Signal: close when a bar closes above the upper Bollinger Band.
EVIL_PANDA_BB=false
# Bollinger Band length (SMA).
EVIL_PANDA_BB_LENGTH=20
# Bollinger Band width in standard deviations.
EVIL_PANDA_BB_STDDEV=2

# ===== Transactions =====
# Applies to everything the bot sends: Auto Entry, /open, close, claim, flip
# and withdraw.

# Opens and flips: how far (%) the active bin may move while liquidity is
# added before the transaction fails. 10 = about 5 bins on a 2% bin step pool.
ENTRY_ACTIVE_BIN_SLIPPAGE_PCT=10
# none     = no extra fee, resend until confirmed
# priority = add a priority fee
# jito     = pay a Jito tip (sent through the Jito block engine)
# both     = priority fee + Jito tip
ENTRY_FEE_MODE=none
# Priority fee in micro-lamports per compute unit (priority / both).
ENTRY_PRIORITY_FEE_MICRO_LAMPORTS=50000
# Compute unit limit to request. 0 = let the Meteora SDK decide.
ENTRY_COMPUTE_UNIT_LIMIT=0
# Jito tip in SOL (jito / both).
ENTRY_JITO_TIP_SOL=0.001
# Hard cap on the estimated fee for an open, close or flip (SOL). Above it,
# that action is cancelled.
ENTRY_FEE_MAX_SOL=0.002
# How many times to resend a transaction (new blockhash each time).
ENTRY_TX_RETRY_ATTEMPTS=5
# How long (seconds) to wait for each confirmation.
ENTRY_TX_CONFIRM_TIMEOUT_SEC=30
# Resend interval (ms).
ENTRY_TX_RESEND_INTERVAL_MS=2000
# jito / both: also send through the normal RPC for a better landing rate.
ENTRY_DUAL_SEND=true
# Jito block engine endpoint.
JITO_BLOCK_ENGINE_URL=https://mainnet.block-engine.jito.wtf
# Optional Jito tip accounts (comma-separated). Empty = built-in list.
JITO_TIP_ACCOUNTS=

# ===== Swap & sweep =====
# Turning tokens back into SOL after a close, and cleaning up leftovers.

# Swap the token to SOL after a position is closed.
AUTO_SWAP_AFTER_CLOSE=true
# Jupiter slippage (basis points). Used when SWAP_USE_RTSE=false.
SWAP_SLIPPAGE_BPS=100
# true = let Jupiter estimate slippage (RTSE, fewer failed swaps in fast
# markets). false = fixed SWAP_SLIPPAGE_BPS.
SWAP_USE_RTSE=false
# Swap attempts.
SWAP_RETRY_ATTEMPTS=3
# Token balances worth this much USD or less are dust and left alone.
DUST_USD_THRESHOLD=0.5
# While Auto Entry is ON, leftover tokens are swept to SOL. Mints listed here
# (comma-separated) are never swept. Default: USDC.
SWEEP_EXCLUDE_MINTS=EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
# Wait (seconds) before retrying a mint that failed to swap.
SWEEP_FAILURE_COOLDOWN_SEC=1800

# ===== Monitoring =====
# How often open positions are checked, and status reports.

# Position check interval while positions are open (minutes; 0.2 = 12 seconds).
POLL_INTERVAL_HOLD=0.2
# Position check interval when nothing is open (minutes).
POLL_INTERVAL_IDLE=5
# TP / SL / Trail check interval per trade (seconds, min 1).
TRADE_EXIT_INTERVAL_SEC=1
# A position missing on-chain for this many checks in a row is treated as
# closed outside the bot (you get a Telegram alert).
MISSING_CYCLE_THRESHOLD=5
# Status report interval on Telegram and in the log (minutes).
TG_STATUS_INTERVAL=5
# Each check records a PnL snapshot with recent volume in pnl-history.json.
# Number of recent candles fetched for that volume.
VOLUME_CANDLE_COUNT=5
# Candle timeframe for that volume.
VOLUME_TIMEFRAME=5m

# ===== Market data & rate limits =====
# Where candles come from and how hard the bot may hit each API.

# Source for 15m candles (the Supertrend signal). gmgn = native 15m, matches
# the chart. meteora = 15m built from Meteora data.
CANDLE_15M_SOURCE=gmgn
# Cache lifetime for Meteora candles (seconds).
CANDLE_CACHE_TTL_SEC=60
# Wait (seconds) after a 15m bar closes before fetching, so the closed bar is final.
CANDLE_CLOSE_DELAY_SEC=3
# GMGN requests per minute (free tier is about 5/min; leave a margin).
GMGN_MAX_PER_MIN=4
# Minimum gap between GMGN requests (seconds).
GMGN_MIN_GAP_SEC=15
# Switch off entry for a pool whose Supertrend line has not updated for this many minutes.
GMGN_MAX_STALE_MIN=30
# When GMGN fails, fall back to 15m candles built from Meteora (false = safer).
GMGN_FALLBACK_TO_METEORA=false
# Meteora requests per minute.
METEORA_MAX_PER_MIN=120

# ===== Logs =====
# What goes into the PM2 log and how long daily log files are kept.

# info = readable summary (every TG_STATUS_INTERVAL) + important events and errors.
# debug = also technical [detail] lines.
LOG_LEVEL=info
# Keep daily log files (logs/meteorabot-YYYY-MM-DD.log) this many days;
# older ones are deleted at start. 0 = keep all.
LOG_RETENTION_DAYS=7
